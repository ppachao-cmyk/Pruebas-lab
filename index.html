<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Estudiante | Sistema de Gestión Académica</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="page">
  <div class="card">

    <header class="card-header">
      <p class="card-header__kicker">Sistema de Gestión Académica</p>
      <h1 class="card-header__title">Registro de nuevo estudiante</h1>
      <p class="card-header__sub">Completa tus datos para crear tu cuenta institucional.</p>
    </header>

    <form action="/procesar-registro" method="POST" class="form-container" novalidate>

      <fieldset class="form-section">
        <legend>Información personal</legend>

        <div class="form-row">
          <div class="form-group">
            <label for="nombres" class="form-label">Nombres</label>
            <input
              type="text"
              id="nombres"
              name="nombres"
              class="form-input"
              placeholder="Ana María"
              minlength="2"
              maxlength="60"
              required>
          </div>

          <div class="form-group">
            <label for="apellidos" class="form-label">Apellidos</label>
            <input
              type="text"
              id="apellidos"
              name="apellidos"
              class="form-input"
              placeholder="Quispe Mamani"
              minlength="2"
              maxlength="60"
              required>
          </div>
        </div>

        <div class="form-group">
          <label for="fecha_nacimiento" class="form-label">Fecha de nacimiento</label>
          <input
            type="date"
            id="fecha_nacimiento"
            name="fecha_nacimiento"
            class="form-input"
            min="1970-01-01"
            max="2010-12-31"
            required>
          <span class="form-hint">Debes tener entre 16 y 55 años para registrarte.</span>
        </div>

        <div class="form-group">
          <span class="form-label">Turno de estudio</span>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="turno" value="mañana" required>
              <span>Mañana</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="turno" value="tarde">
              <span>Tarde</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="turno" value="noche">
              <span>Noche</span>
            </label>
          </div>
        </div>
      </fieldset>

      <!--
        PENDIENTE (próximos días):
        - Fieldset "Información académica" (código, carrera, créditos, comentarios)
        - Fieldset "Información de la cuenta" (email, password, confirmación)
        - Checkbox de términos y botones de acción
      -->

    </form>
  </div>
</main>

</body>
</html>
